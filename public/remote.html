<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Smart TV Remote Controller</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0d0f17">
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    :root {
      --bg: #0d0f17;
      --surface: #171b26;
      --surface-border: rgba(255, 255, 255, 0.1);
      --accent: #3b82f6;
      --text: #ffffff;
      --text-muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; touch-action: manipulation; }
    body {
      background-color: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      height: 100vh; width: 100vw; overflow: hidden; display: flex; flex-direction: column;
      padding: env(safe-area-inset-top, 16px) 16px env(safe-area-inset-bottom, 16px) 16px;
    }

    #pairing-screen {
      position: absolute; inset: 0; background: var(--bg); z-index: 10000;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 24px; gap: 20px; text-align: center;
    }
    #pairing-screen.hidden { display: none; }
    .pair-input-box { display: flex; flex-direction: column; gap: 14px; width: 100%; max-width: 320px; }
    .pair-code-input {
      background: var(--surface); border: 2px solid var(--surface-border);
      color: #fff; font-size: 28px; text-align: center; letter-spacing: 6px;
      padding: 14px; border-radius: 16px; outline: none; font-family: monospace;
    }
    .pair-code-input:focus { border-color: var(--accent); }
    .btn-connect {
      background: var(--accent); color: #fff; border: none; padding: 14px;
      border-radius: 14px; font-size: 16px; font-weight: 700; cursor: pointer;
    }
    .btn-qr-scan {
      background: rgba(255, 255, 255, 0.08); color: #fff; border: 1px solid var(--surface-border);
      padding: 12px; border-radius: 14px; font-size: 14px; cursor: pointer;
    }
    #scanner-video-container {
      width: 240px; height: 240px; border-radius: 20px; overflow: hidden;
      display: none; position: relative; border: 2px solid var(--accent);
    }
    #scanner-video { width: 100%; height: 100%; object-fit: cover; }

    .header { display: flex; justify-content: space-between; align-items: center; padding: 8px 4px 14px; }
    .status-indicator { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 500; }
    .status-dot { width: 10px; height: 10px; border-radius: 50%; background: #ef4444; }
    .status-dot.connected { background: #10b981; box-shadow: 0 0 10px #10b981; }
    .btn-icon {
      background: var(--surface); border: 1px solid var(--surface-border); color: var(--text);
      width: 42px; height: 42px; border-radius: 12px; display: flex; align-items: center;
      justify-content: center; font-size: 18px; cursor: pointer;
    }

    .tabs { display: flex; background: var(--surface); border-radius: 14px; padding: 4px; margin-bottom: 12px; }
    .tab-btn {
      flex: 1; background: transparent; border: none; color: var(--text-muted);
      padding: 10px; font-size: 14px; font-weight: 600; border-radius: 10px; cursor: pointer;
    }
    .tab-btn.active { background: var(--accent); color: #fff; }

    .trackpad-container { flex: 1; display: flex; flex-direction: column; gap: 10px; min-height: 0; }
    #trackpad {
      flex: 1; width: 100%; background: radial-gradient(circle at center, #1e2433 0%, var(--surface) 100%);
      border: 2px dashed rgba(59, 130, 246, 0.3); border-radius: 20px; touch-action: none;
    }
    #trackpad.active-touch { border-color: var(--accent); }

    .mouse-buttons { display: flex; gap: 10px; height: 60px; }
    .btn-mouse {
      flex: 1; background: var(--surface); border: 1px solid var(--surface-border);
      border-radius: 14px; color: var(--text); font-size: 15px; font-weight: 600;
    }
    .btn-mouse:active { background: var(--accent); }

    .dpad-container { flex: 1; display: none; flex-direction: column; align-items: center; justify-content: center; }
    .dpad-container.visible { display: flex; }
    .dpad-matrix { width: 220px; height: 220px; position: relative; }
    .dpad-btn {
      position: absolute; width: 66px; height: 66px; background: var(--surface);
      border: 1px solid var(--surface-border); color: var(--text); font-size: 22px;
      border-radius: 18px; display: flex; align-items: center; justify-content: center;
    }
    .dpad-up { top: 0; left: 77px; } .dpad-down { bottom: 0; left: 77px; }
    .dpad-left { left: 0; top: 77px; } .dpad-right { right: 0; top: 77px; }
    .dpad-ok { top: 77px; left: 77px; background: var(--accent); border: none; font-weight: 700; }

    .shortcuts-bar { display: flex; justify-content: space-around; gap: 8px; margin-top: 10px; }
    .shortcut-btn {
      flex: 1; padding: 10px 6px; background: var(--surface); border: 1px solid var(--surface-border);
      border-radius: 12px; color: var(--text); font-size: 13px; display: flex;
      flex-direction: column; align-items: center; gap: 4px;
    }

    #hidden-keyboard-input { position: absolute; left: -9999px; top: -9999px; opacity: 0; width: 1px; height: 1px; }
  </style>
</head>
<body>
  <div id="pairing-screen">
    <div style="font-size: 48px;">📺</div>
    <h2>Pair with TV</h2>
    <p style="color: var(--text-muted); font-size: 14px;">Enter the 6-digit code shown on the TV display</p>

    <div class="pair-input-box">
      <input type="number" id="pair-code-input" class="pair-code-input" placeholder="123456" maxlength="6">
      <button class="btn-connect" id="btn-pair-submit">Pair Now</button>
      <button class="btn-qr-scan" id="btn-scan-qr">📷 Scan TV QR Code</button>
      <div id="scanner-video-container">
        <video id="scanner-video" playsinline></video>
      </div>
      <div id="pair-error" style="color: #ef4444; font-size: 13px; display: none;"></div>
    </div>
  </div>

  <input type="text" id="hidden-keyboard-input" autocomplete="off">

  <div class="header">
    <div class="status-indicator">
      <span class="status-dot" id="status-dot"></span>
      <span id="status-text">Connected</span>
      <span id="paired-badge" style="background: rgba(59,130,246,0.2); padding: 2px 8px; border-radius: 8px; font-size: 11px; color: #60a5fa;"></span>
    </div>
    <div class="top-actions">
      <button class="btn-icon" id="btn-toggle-keyboard">⌨️</button>
      <button class="btn-icon" id="btn-disconnect">⎋</button>
    </div>
  </div>

  <div class="tabs">
    <button class="tab-btn active" id="tab-touchpad">Touchpad</button>
    <button class="tab-btn" id="tab-dpad">D-Pad</button>
  </div>

  <div class="trackpad-container" id="view-touchpad">
    <canvas id="trackpad"></canvas>
    <div class="mouse-buttons">
      <button class="btn-mouse" id="btn-left-click">Left Click</button>
      <button class="btn-mouse" id="btn-right-click">Right Click</button>
    </div>
  </div>

  <div class="dpad-container" id="view-dpad">
    <div class="dpad-matrix">
      <button class="dpad-btn dpad-up" data-nav="up">▲</button>
      <button class="dpad-btn dpad-down" data-nav="down">▼</button>
      <button class="dpad-btn dpad-left" data-nav="left">◀</button>
      <button class="dpad-btn dpad-right" data-nav="right">▶</button>
      <button class="dpad-btn dpad-ok" data-nav="enter">OK</button>
    </div>
  </div>

  <div class="shortcuts-bar">
    <button class="shortcut-btn" id="btn-back"><span>↩</span><span>Back</span></button>
    <button class="shortcut-btn" id="btn-home"><span>⌂</span><span>Home</span></button>
    <button class="shortcut-btn" id="btn-playpause"><span>⏯</span><span>Play</span></button>
    <button class="shortcut-btn" id="btn-volup"><span>🔊</span><span>Vol +</span></button>
    <button class="shortcut-btn" id="btn-voldown"><span>🔉</span><span>Vol -</span></button>
  </div>

  <script>
    const socket = io();
    const pairingScreen = document.getElementById('pairing-screen');
    const pairCodeInput = document.getElementById('pair-code-input');
    const pairError = document.getElementById('pair-error');
    const statusDot = document.getElementById('status-dot');
    const statusText = document.getElementById('status-text');
    const trackpad = document.getElementById('trackpad');
    const hiddenInput = document.getElementById('hidden-keyboard-input');
    let activePairingId = null;

    const urlParams = new URLSearchParams(window.location.search);
    const paramPair = urlParams.get('pair');
    if (paramPair) pairCodeInput.value = paramPair;

    function attemptPairing(id) {
      if (!id) return;
      socket.emit('join_pairing', id, (res) => {
        if (res && res.success) {
          activePairingId = id;
          sessionStorage.setItem('smart_tv_pair_id', id);
          pairingScreen.classList.add('hidden');
          statusDot.classList.add('connected');
          statusText.innerText = 'Paired';
          document.getElementById('paired-badge').innerText = `#${id}`;
          stopCamera();
        } else {
          pairError.style.display = 'block';
          pairError.innerText = res.message || 'Pairing failed. Check code.';
        }
      });
    }

    document.getElementById('btn-pair-submit').addEventListener('click', () => {
      attemptPairing(pairCodeInput.value.trim());
    });

    document.getElementById('btn-disconnect').addEventListener('click', () => {
      sessionStorage.removeItem('smart_tv_pair_id');
      window.location.reload();
    });

    socket.on('connect', () => {
      const savedId = sessionStorage.getItem('smart_tv_pair_id') || paramPair;
      if (savedId) attemptPairing(savedId);
    });

    // Camera QR Scanner
    let videoStream = null;
    const scannerContainer = document.getElementById('scanner-video-container');
    const video = document.getElementById('scanner-video');

    document.getElementById('btn-scan-qr').addEventListener('click', async () => {
      if (videoStream) { stopCamera(); return; }
      try {
        videoStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
        video.srcObject = videoStream;
        video.setAttribute('playsinline', true);
        video.play();
        scannerContainer.style.display = 'block';
        requestAnimationFrame(tickScan);
      } catch (err) {
        alert('Camera access denied: ' + err.message);
      }
    });

    function stopCamera() {
      if (videoStream) {
        videoStream.getTracks().forEach(t => t.stop());
        videoStream = null;
        scannerContainer.style.display = 'none';
      }
    }

    function tickScan() {
      if (!videoStream) return;
      if (video.readyState === video.HAVE_ENOUGH_DATA && window.jsQR) {
        const canvas = document.createElement('canvas');
        canvas.width = video.videoWidth; canvas.height = video.videoHeight;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const code = jsQR(imgData.data, imgData.width, imgData.height);
        if (code) {
          const match = code.data.match(/pair=(\d+)/) || code.data.match(/^(\d{6})$/);
          if (match) {
            pairCodeInput.value = match[1];
            attemptPairing(match[1]);
            return;
          }
        }
      }
      requestAnimationFrame(tickScan);
    }

    // Touch Delta Calculations
    let lastX = 0, lastY = 0, touching = false, startT = 0, moveDist = 0;
    const SENSITIVITY = 1.75;

    function resizeCanvas() { trackpad.width = trackpad.clientWidth; trackpad.height = trackpad.clientHeight; }
    window.addEventListener('resize', resizeCanvas);
    setTimeout(resizeCanvas, 100);

    trackpad.addEventListener('touchstart', (e) => {
      if (e.touches.length === 1) {
        touching = true;
        lastX = e.touches[0].clientX;
        lastY = e.touches[0].clientY;
        startT = Date.now();
        moveDist = 0;
        trackpad.classList.add('active-touch');
      }
    }, { passive: false });

    trackpad.addEventListener('touchmove', (e) => {
      e.preventDefault();
      if (touching && e.touches.length === 1) {
        const curX = e.touches[0].clientX;
        const curY = e.touches[0].clientY;
        const dx = (curX - lastX) * SENSITIVITY;
        const dy = (curY - lastY) * SENSITIVITY;
        moveDist += Math.hypot(dx, dy);
        socket.emit('mouse_move', { dx, dy });
        lastX = curX;
        lastY = curY;
      }
    }, { passive: false });

    trackpad.addEventListener('touchend', (e) => {
      if (touching && e.touches.length === 0) {
        if (Date.now() - startT < 250 && moveDist < 10) {
          socket.emit('mouse_click', { button: 'left' });
        }
        touching = false;
        trackpad.classList.remove('active-touch');
      }
    });

    document.getElementById('btn-left-click').addEventListener('click', () => socket.emit('mouse_click', { button: 'left' }));
    document.getElementById('btn-right-click').addEventListener('click', () => socket.emit('mouse_click', { button: 'right' }));

    // Hidden Keyboard Input Capture
    document.getElementById('btn-toggle-keyboard').addEventListener('click', () => {
      hiddenInput.focus();
      hiddenInput.click();
    });
    hiddenInput.addEventListener('input', () => {
      if (hiddenInput.value.length > 0) {
        socket.emit('keyboard_input', { text: hiddenInput.value.slice(-1), type: 'text' });
        hiddenInput.value = '';
      }
    });
    hiddenInput.addEventListener('keydown', (e) => {
      if (e.key === 'Backspace' || e.key === 'Enter') {
        socket.emit('keyboard_input', { key: e.key, type: 'key_press' });
      }
    });

    // D-Pad and shortcuts
    document.querySelectorAll('.dpad-btn').forEach(btn => {
      btn.addEventListener('click', () => socket.emit('nav_action', btn.getAttribute('data-nav')));
    });

    const tabTouchpad = document.getElementById('tab-touchpad');
    const tabDpad = document.getElementById('tab-dpad');
    const viewTouchpad = document.getElementById('view-touchpad');
    const viewDpad = document.getElementById('view-dpad');

    tabTouchpad.addEventListener('click', () => {
      tabTouchpad.classList.add('active'); tabDpad.classList.remove('active');
      viewTouchpad.style.display = 'flex'; viewDpad.classList.remove('visible');
    });
    tabDpad.addEventListener('click', () => {
      tabDpad.classList.add('active'); tabTouchpad.classList.remove('active');
      viewTouchpad.style.display = 'none'; viewDpad.classList.add('visible');
    });

    document.getElementById('btn-back').addEventListener('click', () => socket.emit('keyboard_input', { key: 'Escape', type: 'key_press' }));
    document.getElementById('btn-home').addEventListener('click', () => socket.emit('nav_action', 'home'));
    document.getElementById('btn-playpause').addEventListener('click', () => socket.emit('keyboard_input', { key: 'space', type: 'key_press' }));
    document.getElementById('btn-volup').addEventListener('click', () => socket.emit('keyboard_input', { key: 'ArrowUp', type: 'key_press' }));
    document.getElementById('btn-voldown').addEventListener('click', () => socket.emit('keyboard_input', { key: 'ArrowDown', type: 'key_press' }));
  </script>
</body>
</html>
