<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Smart TV Remote Controller</title>
  <!-- Embedded libraries for Standalone Offline APK operation -->
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <style>
    :root {
      --bg: #0b0e14;
      --surface: #151923;
      --surface-border: rgba(255, 255, 255, 0.1);
      --accent: #3b82f6;
      --text: #ffffff;
      --text-muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; touch-action: manipulation; }
    body {
      background-color: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      height: 100vh; width: 100vw; overflow: hidden; display: flex; flex-direction: column;
      padding: env(safe-area-inset-top, 16px) 16px env(safe-area-inset-bottom, 16px) 16px;
    }

    /* Immediate Startup Camera QR Scanner Screen */
    #scanner-screen {
      position: absolute; inset: 0; background: var(--bg); z-index: 10000;
      display: flex; flex-direction: column; align-items: center; justify-content: space-between;
      padding: 32px 24px; text-align: center;
    }
    #scanner-screen.hidden { display: none; }

    .scanner-header h2 { font-size: 24px; font-weight: 700; margin-bottom: 6px; }
    .scanner-header p { font-size: 14px; color: var(--text-muted); }

    .scanner-viewport {
      width: 270px; height: 270px; border-radius: 28px; overflow: hidden;
      position: relative; border: 3px solid var(--accent);
      box-shadow: 0 0 30px rgba(59, 130, 246, 0.4);
      background: #000; display: flex; align-items: center; justify-content: center;
    }
    #scanner-video { width: 100%; height: 100%; object-fit: cover; }

    /* Animated Laser Line */
    .scanner-laser {
      position: absolute; left: 0; right: 0; height: 3px;
      background: linear-gradient(90deg, transparent, #60a5fa, transparent);
      box-shadow: 0 0 12px #60a5fa;
      animation: scanLaser 2s infinite ease-in-out;
    }
    @keyframes scanLaser {
      0% { top: 10%; opacity: 0.2; }
      50% { top: 90%; opacity: 1; }
      100% { top: 10%; opacity: 0.2; }
    }

    .scanner-footer { width: 100%; max-width: 300px; display: flex; flex-direction: column; gap: 10px; }
    .status-badge-connecting {
      background: rgba(59, 130, 246, 0.2); border: 1px solid rgba(59, 130, 246, 0.4);
      color: #93c5fd; padding: 10px 16px; border-radius: 14px; font-size: 13px; font-weight: 500;
    }

    /* Remote UI Interface */
    .header { display: flex; justify-content: space-between; align-items: center; padding: 8px 4px 14px; }
    .status-indicator { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 500; }
    .status-dot { width: 10px; height: 10px; border-radius: 50%; background: #10b981; box-shadow: 0 0 10px #10b981; }
    .btn-icon {
      background: var(--surface); border: 1px solid var(--surface-border); color: var(--text);
      width: 42px; height: 42px; border-radius: 12px; display: flex; align-items: center;
      justify-content: center; font-size: 18px; cursor: pointer;
    }

    .tabs { display: flex; background: var(--surface); border-radius: 14px; padding: 4px; margin-bottom: 12px; }
    .tab-btn {
      flex: 1; background: transparent; border: none; color: var(--text-muted);
      padding: 10px; font-size: 14px; font-weight: 600; border-radius: 10px; cursor: pointer;
    }
    .tab-btn.active { background: var(--accent); color: #fff; }

    .trackpad-container { flex: 1; display: flex; flex-direction: column; gap: 10px; min-height: 0; }
    #trackpad {
      flex: 1; width: 100%; background: radial-gradient(circle at center, #1b212f 0%, var(--surface) 100%);
      border: 2px dashed rgba(59, 130, 246, 0.35); border-radius: 20px; touch-action: none;
    }
    #trackpad.active-touch { border-color: var(--accent); }

    .mouse-buttons { display: flex; gap: 10px; height: 60px; }
    .btn-mouse {
      flex: 1; background: var(--surface); border: 1px solid var(--surface-border);
      border-radius: 14px; color: var(--text); font-size: 15px; font-weight: 600;
    }
    .btn-mouse:active { background: var(--accent); }

    .dpad-container { flex: 1; display: none; flex-direction: column; align-items: center; justify-content: center; }
    .dpad-container.visible { display: flex; }
    .dpad-matrix { width: 220px; height: 220px; position: relative; }
    .dpad-btn {
      position: absolute; width: 66px; height: 66px; background: var(--surface);
      border: 1px solid var(--surface-border); color: var(--text); font-size: 22px;
      border-radius: 18px; display: flex; align-items: center; justify-content: center;
    }
    .dpad-up { top: 0; left: 77px; } .dpad-down { bottom: 0; left: 77px; }
    .dpad-left { left: 0; top: 77px; } .dpad-right { right: 0; top: 77px; }
    .dpad-ok { top: 77px; left: 77px; background: var(--accent); border: none; font-weight: 700; }

    .shortcuts-bar { display: flex; justify-content: space-around; gap: 8px; margin-top: 10px; }
    .shortcut-btn {
      flex: 1; padding: 10px 6px; background: var(--surface); border: 1px solid var(--surface-border);
      border-radius: 12px; color: var(--text); font-size: 13px; display: flex;
      flex-direction: column; align-items: center; gap: 4px;
    }

    #hidden-keyboard-input { position: absolute; left: -9999px; top: -9999px; opacity: 0; width: 1px; height: 1px; }
  </style>
</head>
<body>

  <!-- Screen 1: Camera Scanner on Bootup -->
  <div id="scanner-screen">
    <div class="scanner-header">
      <h2>Scan Smart TV QR Code</h2>
      <p>Point your camera at the QR code shown on the TV</p>
    </div>

    <div class="scanner-viewport">
      <video id="scanner-video" playsinline></video>
      <div class="scanner-laser"></div>
    </div>

    <div class="scanner-footer">
      <div class="status-badge-connecting" id="scan-status-text">Searching for TV QR code...</div>
    </div>
  </div>

  <input type="text" id="hidden-keyboard-input" autocomplete="off">

  <!-- Screen 2: Remote Control System (Shown instantly after QR is recognized) -->
  <div class="header">
    <div class="status-indicator">
      <span class="status-dot"></span>
      <span id="remote-header-tv-label">Connected</span>
      <span id="paired-badge" style="background: rgba(59,130,246,0.2); padding: 2px 8px; border-radius: 8px; font-size: 11px; color: #60a5fa;"></span>
    </div>
    <div class="top-actions">
      <button class="btn-icon" id="btn-toggle-keyboard">⌨️</button>
      <button class="btn-icon" id="btn-rescan">📷</button>
    </div>
  </div>

  <div class="tabs">
    <button class="tab-btn active" id="tab-touchpad">Touchpad</button>
    <button class="tab-btn" id="tab-dpad">D-Pad</button>
  </div>

  <div class="trackpad-container" id="view-touchpad">
    <canvas id="trackpad"></canvas>
    <div class="mouse-buttons">
      <button class="btn-mouse" id="btn-left-click">Left Click</button>
      <button class="btn-mouse" id="btn-right-click">Right Click</button>
    </div>
  </div>

  <div class="dpad-container" id="view-dpad">
    <div class="dpad-matrix">
      <button class="dpad-btn dpad-up" data-nav="up">▲</button>
      <button class="dpad-btn dpad-down" data-nav="down">▼</button>
      <button class="dpad-btn dpad-left" data-nav="left">◀</button>
      <button class="dpad-btn dpad-right" data-nav="right">▶</button>
      <button class="dpad-btn dpad-ok" data-nav="enter">OK</button>
    </div>
  </div>

  <!-- Dedicated Sleek Volume Control Bar -->
  <div class="volume-slider-container" style="
    background: var(--surface); border: 1px solid var(--surface-border);
    border-radius: 18px; padding: 12px 16px; margin: 8px 0; display: flex;
    align-items: center; gap: 12px; box-shadow: 0 4px 14px rgba(0,0,0,0.3);
  ">
    <button id="btn-vol-mute" style="background: none; border: none; font-size: 20px; cursor: pointer;">🔉</button>
    <input type="range" id="volume-slider" min="0" max="100" value="70" style="
      flex: 1; accent-color: var(--accent); height: 6px; border-radius: 4px; outline: none; cursor: pointer;
    ">
    <span id="volume-label" style="font-size: 13px; font-weight: 700; color: #60a5fa; min-width: 38px; text-align: right;">70%</span>
  </div>

  <div class="shortcuts-bar">
    <button class="shortcut-btn" id="btn-back"><span>↩</span><span>Back</span></button>
    <button class="shortcut-btn" id="btn-home"><span>⌂</span><span>Home</span></button>
    <button class="shortcut-btn" id="btn-playpause"><span>⏯</span><span>Play</span></button>
    <button class="shortcut-btn" id="btn-volup"><span>🔊</span><span>Vol +</span></button>
    <button class="shortcut-btn" id="btn-voldown"><span>🔉</span><span>Vol -</span></button>
  </div>

  <script>
    let socket = null;
    let videoStream = null;
    const scannerScreen = document.getElementById('scanner-screen');
    const scanStatusText = document.getElementById('scan-status-text');
    const video = document.getElementById('scanner-video');
    const trackpad = document.getElementById('trackpad');
    const hiddenInput = document.getElementById('hidden-keyboard-input');

    // ----------------------------------------------------
    // Auto-launch Camera QR Scanner Immediately on Boot
    // ----------------------------------------------------
    async function startCameraScanner() {
      try {
        scannerScreen.classList.remove('hidden');
        scanStatusText.innerText = 'Searching for TV QR code...';
        videoStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'environment' }
        });
        video.srcObject = videoStream;
        video.setAttribute('playsinline', true);
        await video.play();
        requestAnimationFrame(processQRFrame);
      } catch (err) {
        scanStatusText.innerText = 'Camera access error: ' + err.message;
      }
    }

    function stopCamera() {
      if (videoStream) {
        videoStream.getTracks().forEach(t => t.stop());
        videoStream = null;
      }
    }

    function processQRFrame() {
      if (!videoStream) return;
      if (video.readyState === video.HAVE_ENOUGH_DATA && window.jsQR) {
        const canvas = document.createElement('canvas');
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const code = jsQR(imageData.data, imageData.width, imageData.height);

        if (code && code.data) {
          handleScannedData(code.data);
          return;
        }
      }
      requestAnimationFrame(processQRFrame);
    }

    // ----------------------------------------------------
    // Auto Connect to Extracted IP & Pairing ID
    // ----------------------------------------------------
    function handleScannedData(rawString) {
      let serverUrl = null;
      let pairingId = null;

      try {
        // Structured JSON payload
        const parsed = JSON.parse(rawString);
        if (parsed.serverUrl && parsed.id) {
          serverUrl = parsed.serverUrl;
          pairingId = parsed.id;
        }
      } catch (e) {
        // Fallback parameter parsing (http://192.168.1.5:3000?pair=123456)
        const match = rawString.match(/(http:\/\/[^?]+)\?pair=(\d+)/);
        if (match) {
          serverUrl = match[1];
          pairingId = match[2];
        }
      }

      if (serverUrl && pairingId) {
        scanStatusText.innerText = `Connecting to ${serverUrl}...`;
        stopCamera();
        connectToTV(serverUrl, pairingId);
      } else {
        requestAnimationFrame(processQRFrame);
      }
    }

    function connectToTV(serverUrl, pairingId) {
      if (socket) socket.disconnect();

      socket = io(serverUrl, { reconnection: true, timeout: 5000 });

      socket.on('connect', () => {
        socket.emit('join_pairing', pairingId, (res) => {
          if (res && res.success) {
            scannerScreen.classList.add('hidden');
            document.getElementById('paired-badge').innerText = `#${pairingId}`;
            if (navigator.vibrate) navigator.vibrate(50);
          } else {
            alert('Pairing rejected by TV.');
            startCameraScanner();
          }
        });
      });

      socket.on('disconnect', () => {
        scanStatusText.innerText = 'Connection lost. Reconnecting...';
      });

      socket.on('connect_error', (err) => {
        scanStatusText.innerText = 'Connection failed. Check same Wi-Fi.';
      });
    }

    document.getElementById('btn-rescan').addEventListener('click', () => {
      startCameraScanner();
    });

    // Touch Delta Calculations
    let lastX = 0, lastY = 0, touching = false, startT = 0, moveDist = 0;
    const SENSITIVITY = 1.75;

    function resizeCanvas() { trackpad.width = trackpad.clientWidth; trackpad.height = trackpad.clientHeight; }
    window.addEventListener('resize', resizeCanvas);
    setTimeout(resizeCanvas, 100);

    trackpad.addEventListener('touchstart', (e) => {
      if (e.touches.length === 1) {
        touching = true;
        lastX = e.touches[0].clientX;
        lastY = e.touches[0].clientY;
        startT = Date.now();
        moveDist = 0;
        trackpad.classList.add('active-touch');
      }
    }, { passive: false });

    trackpad.addEventListener('touchmove', (e) => {
      e.preventDefault();
      if (touching && e.touches.length === 1 && socket) {
        const curX = e.touches[0].clientX;
        const curY = e.touches[0].clientY;
        const dx = (curX - lastX) * SENSITIVITY;
        const dy = (curY - lastY) * SENSITIVITY;
        moveDist += Math.hypot(dx, dy);
        socket.emit('mouse_move', { dx, dy });
        lastX = curX;
        lastY = curY;
      }
    }, { passive: false });

    trackpad.addEventListener('touchend', (e) => {
      if (touching && e.touches.length === 0) {
        if (Date.now() - startT < 250 && moveDist < 10 && socket) {
          socket.emit('mouse_click', { button: 'left' });
        }
        touching = false;
        trackpad.classList.remove('active-touch');
      }
    });

    document.getElementById('btn-left-click').addEventListener('click', () => {
      if (socket) socket.emit('mouse_click', { button: 'left' });
    });
    document.getElementById('btn-right-click').addEventListener('click', () => {
      if (socket) socket.emit('mouse_click', { button: 'right' });
    });

    // Hidden Keyboard Input Capture
    document.getElementById('btn-toggle-keyboard').addEventListener('click', () => {
      hiddenInput.focus();
      hiddenInput.click();
    });
    hiddenInput.addEventListener('input', () => {
      if (hiddenInput.value.length > 0 && socket) {
        socket.emit('keyboard_input', { text: hiddenInput.value.slice(-1), type: 'text' });
        hiddenInput.value = '';
      }
    });
    hiddenInput.addEventListener('keydown', (e) => {
      if ((e.key === 'Backspace' || e.key === 'Enter') && socket) {
        socket.emit('keyboard_input', { key: e.key, type: 'key_press' });
      }
    });

    // D-Pad and shortcuts
    document.querySelectorAll('.dpad-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        if (socket) socket.emit('nav_action', btn.getAttribute('data-nav'));
      });
    });

    const tabTouchpad = document.getElementById('tab-touchpad');
    const tabDpad = document.getElementById('tab-dpad');
    const viewTouchpad = document.getElementById('view-touchpad');
    const viewDpad = document.getElementById('view-dpad');

    tabTouchpad.addEventListener('click', () => {
      tabTouchpad.classList.add('active'); tabDpad.classList.remove('active');
      viewTouchpad.style.display = 'flex'; viewDpad.classList.remove('visible');
    });
    tabDpad.addEventListener('click', () => {
      tabDpad.classList.add('active'); tabTouchpad.classList.remove('active');
      viewTouchpad.style.display = 'none'; viewDpad.classList.add('visible');
    });

    // ----------------------------------------------------
    // Dedicated Visual Volume Slider & Stepping
    // ----------------------------------------------------
    const volSlider = document.getElementById('volume-slider');
    const volLabel = document.getElementById('volume-label');
    const btnMute = document.getElementById('btn-vol-mute');

    function emitVolume(val, action = 'set') {
      const clamped = Math.max(0, Math.min(100, Number(val)));
      volSlider.value = clamped;
      volLabel.innerText = `${clamped}%`;
      if (socket) {
        socket.emit('tv_volume_change', { value: clamped, action });
      }
    }

    volSlider.addEventListener('input', (e) => {
      emitVolume(e.target.value, 'slider');
    });

    let isMuted = false;
    let preMuteVol = 70;
    btnMute.addEventListener('click', () => {
      if (!isMuted) {
        preMuteVol = Number(volSlider.value);
        emitVolume(0, 'mute');
        btnMute.innerText = '🔇';
        isMuted = true;
      } else {
        emitVolume(preMuteVol, 'unmute');
        btnMute.innerText = '🔊';
        isMuted = false;
      }
      if (navigator.vibrate) navigator.vibrate(25);
    });

    document.getElementById('btn-back').addEventListener('click', () => socket && socket.emit('keyboard_input', { key: 'Escape', type: 'key_press' }));
    document.getElementById('btn-home').addEventListener('click', () => socket && socket.emit('nav_action', 'home'));
    document.getElementById('btn-playpause').addEventListener('click', () => socket && socket.emit('keyboard_input', { key: 'space', type: 'key_press' }));
    
    document.getElementById('btn-volup').addEventListener('click', () => {
      const next = Math.min(100, Number(volSlider.value) + 5);
      emitVolume(next, 'step_up');
      if (navigator.vibrate) navigator.vibrate(20);
    });
    
    document.getElementById('btn-voldown').addEventListener('click', () => {
      const next = Math.max(0, Number(volSlider.value) - 5);
      emitVolume(next, 'step_down');
      if (navigator.vibrate) navigator.vibrate(20);
    });

    // Auto-boot camera scanner upon app startup
    window.addEventListener('DOMContentLoaded', () => {
      startCameraScanner();
    });
  </script>
</body>
</html>
